buildscript {
    dependencies {
        // Keep the Kotlin plugin version in one place for the app.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

plugins {
    // The app module applies the Android plugin at this version.
    id 'com.android.application' version '9.5.1' apply false
}
