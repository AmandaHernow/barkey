// Copyright 2026 Amanda Hernow. Modified for BarKey.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'net.hernow.barkey'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    // These values identify the public BarKey app and supported Android versions.
    defaultConfig {
        applicationId 'net.hernow.barkey'
        minSdk = 24
        targetSdk = 37
        versionCode = 2
        versionName = '1.1.0'
    }

    // Keep Java and Kotlin bytecode targets aligned.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildTypes {
        release {
            // AGP 9.3+ enables R8 code shrinking/optimisation and resource shrinking together.
            // Keep this release-only so Debug remains easy to inspect and troubleshoot.
            optimization {
                enable = true
            }
        }
    }

    // Unit tests use default values for Android APIs they do not mock.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // CameraX supplies the live preview and camera frames; ZXing decodes locally.
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    // CameraX camera-view 1.6.2 requests AppCompat 1.1.0, which brings Fragment 1.1.0
    // and Activity 1.0.0. This direct runtime version keeps CameraX's required AppCompat API
    // while allowing Gradle to select the current compatible AndroidX transitive versions.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // CameraX camera-view 1.6.2 also requests Fragment 1.1.0 directly. Keep the
    // transitive Fragment API current without imposing a global version override.
    implementation 'androidx.fragment:fragment:1.9.1'
    // Keep the Activity runtime dependency selected through AppCompat and Fragment current.
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'io.github.zxing-cpp:android:3.1.1'
    // CameraX brings Guava transitively; pin the Android variant past GHSA-xxph-c9ww-hj94.
    implementation 'com.google.guava:guava:33.7.2-android'

    testImplementation 'junit:junit:4.13.2'
}
