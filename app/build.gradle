// Modified by Amanda Hernow for BarKey in 2026; based on the 2020 Android Barcode Keyboard project.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'net.hernow.barkey'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId 'net.hernow.barkey'
        minSdk = 24
    targetSdk = 37
        versionCode = 3
        versionName = '1.0.1'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'io.github.zxing-cpp:android:3.1.1'
    // CameraX brings Guava transitively; pin the Android variant past GHSA-xxph-c9ww-hj94.
    implementation 'com.google.guava:guava:33.7.2-android'

    testImplementation 'junit:junit:4.13.2'
}
